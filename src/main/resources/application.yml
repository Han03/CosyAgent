spring:
  application:
    name: cosy-agent
  profiles:
    # 本地默认启用 local：加载 application-local.yml（.gitignore 排除，仅存本机密钥，不入库）
    default: ${COSY_SPRING_PROFILES_DEFAULT:local}
  ai:
    openai:
      # OpenAI 兼容接口（可切换 DeepSeek / Qwen 等，仅改 base-url 与 model）
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:sk-demo}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
  data:
    redis:
      # Redis 多层记忆存储（Step 3 生效）；服务不可用时记忆自动降级，不影响基础问答
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 2s

cosy:
  agent:
    max-iterations: 8        # ReAct 最大迭代轮数（Step 2 生效）
    tool-timeout: 30s        # 单次工具调用超时（Step 5 生效）
    session-timeout: 30m     # 会话记忆 TTL（Step 3 生效）
    long-term-timeout: 180d  # 长期记忆 TTL（Step 3 生效）
    working-timeout: 10m     # 工作记忆 TTL（Step 3 生效）
    vector:
      # 知识检索（Step 4 生效）：store=memory 为内存实现（无外部依赖，默认）；
      # store=pgvector 走 PostgreSQL + PGVector（生产形态，需安装 pgvector 扩展）
      store: ${COSY_AGENT_VECTOR_STORE:memory}
      namespace: ${COSY_AGENT_VECTOR_NAMESPACE:default}   # 默认命名空间（业务域/租户隔离）
      top-k: ${COSY_AGENT_VECTOR_TOP_K:5}                 # 检索返回最大命中数
      min-score: ${COSY_AGENT_VECTOR_MIN_SCORE:0.15}      # 最小相似度阈值
      chunk-size: ${COSY_AGENT_VECTOR_CHUNK_SIZE:600}     # 文档切分块大小（字符）
      overlap: ${COSY_AGENT_VECTOR_OVERLAP:50}            # 切分块重叠（字符）
      pg:
        # store=pgvector 时生效（原生 JDBC，不触发 DataSource 自动配置）
        url: ${COSY_AGENT_VECTOR_PG_URL:jdbc:postgresql://localhost:5432/cosy}
        username: ${COSY_AGENT_VECTOR_PG_USER:postgres}
        password: ${COSY_AGENT_VECTOR_PG_PASSWORD:postgres}
    mock:
      # LLM 端到端 Mock 模块（Step M）：开启后以剧本引擎替代真实 LLM 推理，
      # 其余全链路（编排/工具执行/记忆读写）真实运行；关闭则走真实 LLM。
      # 请求头 X-Cosy-Mock: true|false 可请求级覆盖本开关（优先级更高），供客户端设置页动态切换。
      enabled: ${COSY_AGENT_MOCK_ENABLED:false}
      mode: ${COSY_AGENT_MOCK_MODE:random}   # random：全随机（演示）；scripted：固定剧本+种子（CI 可复现）
      script: ${COSY_AGENT_MOCK_SCRIPT:time} # scripted 模式指定剧本 id
      seed: ${COSY_AGENT_MOCK_SEED:42}       # scripted 模式随机种子
      max-turns: ${COSY_AGENT_MOCK_MAX_TURNS:8}  # mock 自身回合上限
      latency:
        enabled: ${COSY_AGENT_MOCK_LATENCY_ENABLED:true}   # 模拟推理延迟开关（贴近真实模型耗时）
        min-ms: ${COSY_AGENT_MOCK_LATENCY_MIN_MS:500}      # 单次模型调用最小延迟
        max-ms: ${COSY_AGENT_MOCK_LATENCY_MAX_MS:2500}     # 最大延迟（8 轮 × 2.5s=20s < 客户端 30s 超时）
      probability:
        extra-turn: 0.4      # 追加一轮工具调用（模拟多考虑一轮）
        unknown-tool: 0.1    # 工具名替换为未注册名（未知工具自愈路径）
        multi-tool: 0.1      # 单轮多工具并行
        error: 0.05          # 模型异常（FAILED 终止路径）
    model-routing:
      # 模型路由（Step R）：多平台候选链 + 按顺序降级；配置权威在后端
      # （YAML 基线 + 管理 API 热更新，store 持久化可选）。请求头 X-Cosy-Model:
      # auto（缺省）| platform/model 指定模型（锁定单候选，不跨模型降级）。
      enabled: ${COSY_MODEL_ROUTING_ENABLED:true}
      max-candidates: ${COSY_MODEL_ROUTING_MAX_CANDIDATES:5}   # 单链候选上限
      store: ${COSY_MODEL_ROUTING_STORE:memory}                # memory | pg | mysql
      platforms:
        aliyun:                       # 阿里云百炼（OpenAI 兼容；端点 {base}/v1/chat/completions）
          base-url: ${COSY_ALIYUN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
          api-key: ${COSY_ALIYUN_API_KEY:}
          completions-path: ${COSY_ALIYUN_COMPLETIONS_PATH:/v1/chat/completions}
        zhipu:                        # 智谱开放平台（端点 {base}/chat/completions，无 /v1）
          base-url: ${COSY_ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
          api-key: ${COSY_ZHIPU_API_KEY:}
          completions-path: ${COSY_ZHIPU_COMPLETIONS_PATH:/chat/completions}
        volcengine:                   # 火山方舟（端点 {base}/chat/completions，无 /v1）
          base-url: ${COSY_VOLCENGINE_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
          api-key: ${COSY_VOLCENGINE_API_KEY:}
          completions-path: ${COSY_VOLCENGINE_COMPLETIONS_PATH:/chat/completions}
        openrouter:                   # OpenRouter（端点 {base}/v1/chat/completions）
          base-url: ${COSY_OPENROUTER_BASE_URL:https://openrouter.ai/api}
          api-key: ${COSY_OPENROUTER_API_KEY:}
          completions-path: ${COSY_OPENROUTER_COMPLETIONS_PATH:/v1/chat/completions}
      routes:
        default:                      # auto 模式默认链（降级顺序）
          - zhipu/glm-4-flash
          - aliyun/qwen-max
          - openrouter/stealth/ox-alpha
          - volcengine/doubao-seed-2-1-pro-260628
        reasoning:
      # 自动路由决策层（v2.1）：auto 且未显式指定路由类型时按任务动态决策。
      # 档位 auto-resolver: static（现状静态链）| task-tag（L1 标签路由）| scoring（L2 画像打分排序）。
      # 管理 API PUT /api/agent/model-routing 可热更新本段（不随 store 持久化，重启回 YAML）。
      auto-resolver: ${COSY_MODEL_ROUTING_AUTO_RESOLVER:static}
      auto-rules:                       # L1 规则表：配置顺序=优先级，首个命中生效
        - tag: long-context             # 上下文规模超链内窗口 60%（比例可配）
          min-tools: 0
          max-token-ratio: 0.6
          keywords: []
        - tag: tool-heavy               # 工具数量 ≥ 3（工具调用密集）
          min-tools: 3
          max-token-ratio: 0
          keywords: []
        - tag: reasoning                # 用户意图命中推理特征
          min-tools: 0
          max-token-ratio: 0
          keywords: ["为什么", "推导", "证明", "分析", "解释", "代码", "算法", "why", "explain", "derive", "prove", "analyze"]
        - tag: creative                 # 用户意图命中创作特征
          min-tools: 0
          max-token-ratio: 0
          keywords: ["写", "创作", "故事", "文案", "润色", "小说", "诗句", "write", "story", "creative", "poem"]
      # scoring 档位的打分权重（缺省键用默认：reasoning .3 / tools .2 / context .2 / reliability .15 / speed .1 / price .05）
      # scoring-weights: { reasoning: 0.3, tools: 0.2, context: 0.2, reliability: 0.15, speed: 0.1, price: 0.05 }
      pg:
        # store=pg 时生效（原生 JDBC，与 task store 同库同源）
        url: ${COSY_MODEL_ROUTING_PG_URL:jdbc:postgresql://localhost:5432/cosy}
        username: ${COSY_MODEL_ROUTING_PG_USER:postgres}
        password: ${COSY_MODEL_ROUTING_PG_PASSWORD:postgres}
      mysql:
        # store=mysql 时生效
        url: ${COSY_MODEL_ROUTING_MYSQL_URL:jdbc:mysql://localhost:3306/cosy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
        username: ${COSY_MODEL_ROUTING_MYSQL_USER:cosy}
        password: ${COSY_MODEL_ROUTING_MYSQL_PASSWORD:cosy}
    task:
      # 任务状态持久化（Step 6）：store=memory 为内存实现（默认，无外部依赖，重启即失）；
      # store=pg 走 PostgreSQL（生产形态，表 agent_task/agent_trace 自建，需 PostgreSQL 运行）；
      # store=mysql 走 MySQL 存储业务数据（同构表结构，需 MySQL 运行）
      store: ${COSY_AGENT_TASK_STORE:memory}
      pg:
        # store=pg 时生效（原生 JDBC，不触发 DataSource 自动配置）
        url: ${COSY_AGENT_TASK_PG_URL:jdbc:postgresql://localhost:5432/cosy}
        username: ${COSY_AGENT_TASK_PG_USER:postgres}
        password: ${COSY_AGENT_TASK_PG_PASSWORD:postgres}
      mysql:
        # store=mysql 时生效（原生 JDBC，不触发 DataSource 自动配置）
        url: ${COSY_AGENT_TASK_MYSQL_URL:jdbc:mysql://localhost:3306/cosy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
        username: ${COSY_AGENT_TASK_MYSQL_USER:cosy}
        password: ${COSY_AGENT_TASK_MYSQL_PASSWORD:cosy}
    security:
      # API 鉴权（Step 6 生产化）：配置后 /api/** 需携带 X-API-Key 请求头；
      # 留空（默认）不启用，便于本地开发与测试。
      api-key: ${COSY_AGENT_API_KEY:}
    capability:
      # 能力注册中心（参考 Nacos AP/CP）：外部项目注册能力 → Agent 远程调用
      # enabled=false（默认）：注册 API 与动态工具注入不生效，系统与现状等价
      enabled: ${COSY_AGENT_CAPABILITY_ENABLED:false}
      # 注册鉴权令牌（X-Capability-Token；空 = 不校验，本地开发可用）
      token: ${COSY_AGENT_CAPABILITY_TOKEN:}
      # 注册未声明 mode 时的兜底：ap（临时/心跳摘除）| cp（持久/显式注销）
      default-mode: ${COSY_AGENT_CAPABILITY_DEFAULT_MODE:ap}
      heartbeat:
        # AP 心跳节奏（对齐 Nacos 临时实例）：5s 续约周期 / 15s 未续约标记可疑 / 30s 未续约摘除
        interval: ${COSY_AGENT_CAPABILITY_HEARTBEAT_INTERVAL:5s}
        suspect-after: ${COSY_AGENT_CAPABILITY_HEARTBEAT_SUSPECT_AFTER:15s}
        expire-after: ${COSY_AGENT_CAPABILITY_HEARTBEAT_EXPIRE_AFTER:30s}
      probe:
        # CP 主动健康检查：周期探测 {baseUrl}/healthz，失败标 DOWN（不摘除），恢复自动 UP
        enabled: ${COSY_AGENT_CAPABILITY_PROBE_ENABLED:true}
        interval: ${COSY_AGENT_CAPABILITY_PROBE_INTERVAL:60s}
      # CP 持久化存储：memory（默认，仅内存）| mysql（落库 + 启动恢复）
      store: ${COSY_AGENT_CAPABILITY_STORE:memory}
      # 默认命名空间（注册未声明时兜底；能力全名 = {namespace}_{name}）
      namespace: ${COSY_AGENT_CAPABILITY_NAMESPACE:default}
      # 远程能力调用超时（HTTP 请求读超时，调用侧容错另有 TOOL TimeLimiter）
      call-timeout: ${COSY_AGENT_CAPABILITY_CALL_TIMEOUT:5s}
      mysql:
        # store=mysql 时生效（原生 JDBC，不触发 DataSource 自动配置）
        url: ${COSY_AGENT_CAPABILITY_MYSQL_URL:jdbc:mysql://localhost:3306/cosy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
        username: ${COSY_AGENT_CAPABILITY_MYSQL_USER:cosy}
        password: ${COSY_AGENT_CAPABILITY_MYSQL_PASSWORD:cosy}
    llmlog:
      # 大模型调用记录（旁路采集 llm_call_log，异步批量落库，不影响调用链）
      # enabled=false：不装配，模型调用无记录（行为与现状一致）
      enabled: ${COSY_AGENT_LLMLOG_ENABLED:true}
      # 内容记录策略：plain（开发阶段完整明文，用于排查）| truncated（截断 content-chars）| none（不记内容）
      content-mode: ${COSY_AGENT_LLMLOG_CONTENT_MODE:plain}
      content-chars: ${COSY_AGENT_LLMLOG_CONTENT_CHARS:2000}
      # 异步队列容量（满则丢弃并告警）与批量落库间隔
      queue-capacity: ${COSY_AGENT_LLMLOG_QUEUE_CAPACITY:10000}
      flush-interval-ms: ${COSY_AGENT_LLMLOG_FLUSH_INTERVAL_MS:5000}
      mysql:
        # 与路由/能力 store 同库（独立段便于覆写）；原生 JDBC
        url: ${COSY_AGENT_LLMLOG_MYSQL_URL:jdbc:mysql://localhost:3306/cosy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
        username: ${COSY_AGENT_LLMLOG_MYSQL_USER:cosy}
        password: ${COSY_AGENT_LLMLOG_MYSQL_PASSWORD:cosy}

server:
  port: ${SERVER_PORT:8080}

resilience4j:
  # Step 5 容错策略（设计方案 §7 策略落点矩阵）：按 <target>-<组件> 命名，
  # ResilienceSupport 按命名约定自动查找；实例未配置时对应组件自动跳过。
  retry:
    instances:
      llm-retry:      # LLM 推理：3 次退避重试
        max-attempts: ${COSY_RESILIENCE_LLM_RETRY_ATTEMPTS:3}
        wait-duration: 2s
      tool-retry:     # 幂等工具：2 次重试（AgentTool.retryable=true 才启用）
        max-attempts: ${COSY_RESILIENCE_TOOL_RETRY_ATTEMPTS:2}
        wait-duration: 1s
      memory-retry:   # Redis 记忆读写：2 次快速重试
        max-attempts: 2
        wait-duration: 500ms
      vector-retry:   # 知识库检索：2 次快速重试
        max-attempts: 2
        wait-duration: 500ms
      task-retry:     # 任务/轨迹持久化：2 次快速重试（Step 6）
        max-attempts: 2
        wait-duration: 500ms
  circuitbreaker:
    instances:
      llm-cb:         # LLM 熔断：20 次滑动窗口、失败率 50%、打开 30s
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
      tool-cb:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      memory-cb:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      vector-cb:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      task-cb:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  ratelimiter:
    instances:
      llm-ratelimit:  # LLM 限流：每分钟 60 次，超限不等待直接拒绝
        limit-for-period: 60
        limit-refresh-period: 1m
        timeout-duration: 0s
      tool-ratelimit: # 工具限流：每分钟 120 次
        limit-for-period: 120
        limit-refresh-period: 1m
        timeout-duration: 0s
  timelimiter:
    instances:
      llm-timelimiter:   # LLM 单次调用超时 60s
        timeout-duration: 60s
      tool-timelimiter:  # 工具单次调用超时 30s
        timeout-duration: 30s
      memory-timelimiter: # 记忆读写超时 2s
        timeout-duration: 2s
      vector-timelimiter: # 知识检索超时 5s
        timeout-duration: 5s
      task-timelimiter:   # 任务/轨迹持久化超时 2s（Step 6）
        timeout-duration: 2s
  bulkhead:
    instances:
      llm-bulkhead:   # LLM 并发舱壁：最多 8 并发
        max-concurrent-calls: 8
        max-wait-duration: 0
      tool-bulkhead:
        max-concurrent-calls: 8
        max-wait-duration: 0

logging:
  level:
    io.github.resilience4j: DEBUG   # 观察重试/熔断/限流事件（生产建议 INFO）

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    # Step 3 起 Redis 为记忆存储依赖，纳入健康检查（未启动时显示 DOWN，记忆自动降级）
    redis:
      enabled: true
    # Step 5 起 Resilience4j 容错组件纳入健康检查（熔断打开时对应 DOWN，可联动告警）
    circuitbreakers:
      enabled: true
