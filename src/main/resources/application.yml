spring:
  application:
    name: cosy-agent
  ai:
    openai:
      # OpenAI 兼容接口（可切换 DeepSeek / Qwen 等，仅改 base-url 与 model）
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:sk-demo}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
  data:
    redis:
      # Step 1 不主动连接 Redis；Step 3 实现记忆读写时使用
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 2s

cosy:
  agent:
    max-iterations: 8       # ReAct 最大迭代轮数（Step 2 生效）
    tool-timeout: 30s       # 单次工具调用超时（Step 5 生效）
    session-timeout: 30m    # 会话记忆 TTL（Step 3 生效）
    long-term-timeout: 180d # 长期记忆 TTL（Step 3 生效）

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    # Step 1 不依赖 Redis；Step 3 实现多层记忆后置为 true
    redis:
      enabled: false
